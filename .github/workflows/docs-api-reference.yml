name: API Reference

# The Sphinx artifact behind Mintlify's "API Reference" tab lives in the repo:
# without this job it would stay frozen at the last manual build while the
# docstrings keep changing.

on:
  push:
    branches: ["main"]
    paths:
      - "PyOrchestrate/**/*.py"
      - "sphinx/**"
      - ".github/workflows/docs-api-reference.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: docs-api-reference
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Must stay aligned with .python-version: autodoc renders signatures
      # inherited from the standard library, and those change between Python
      # versions. With an interpreter other than the one used locally the
      # artifact flips back and forth on every build (enum.Enum's signature
      # changed in 3.12), producing automatic commits that reflect no docstring
      # change at all.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install sphinx==8.1.3
          # `[web]`: autodoc imports the modules it documents, and the
          # reference now includes web_interface.server, which needs fastapi.
          pip install -e ".[web]"

      - name: Build API reference artifact
        run: ./scripts/build_api_reference.sh

      # `main` only accepts changes through a pull request, so the artifact
      # arrives as one. This job used to push straight to `main` and had been
      # broken since that rule was added: the failure stayed invisible until a
      # commit finally left the artifact stale, because a run with nothing to
      # commit never reaches the push and passes.
      #
      # The branch belongs entirely to this job and is rebuilt from the current
      # `main` on every run, so it is force-pushed: an open pull request is
      # updated in place instead of a new one piling up on each docstring
      # change. Merging it touches only `docs/sdk-artifacts/`, which matches
      # none of the paths above, so it cannot retrigger this workflow.
      #
      # The pull request carries no checks: GitHub does not start workflow runs
      # for events raised with GITHUB_TOKEN, and `pull_request` is one of them.
      # Harmless for a diff that is generated output, but it does mean a
      # required status check on `main` would leave this one unmergeable.
      - name: Open a pull request if the artifact changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: docs/api-reference
        run: |
          if [ -z "$(git status --porcelain docs/sdk-artifacts)" ]; then
            echo "No changes to the API reference."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add docs/sdk-artifacts
          git commit -m "docs: regenerate the API reference from the docstrings"
          git push --force origin "$BRANCH"

          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "Pull request already open; the force-push updated it."
            exit 0
          fi

          gh pr create --base main --head "$BRANCH" \
            --title "docs: regenerate the API reference from the docstrings" \
            --body "$(cat <<'BODY'
          Generated by the API Reference workflow from the docstrings on `main`.

          Only `docs/sdk-artifacts/` changes: it is the Sphinx artifact Mintlify
          reads for the API Reference tab, committed to the repository because
          Mintlify reads it from there.

          Nothing to review line by line — the diff is generated output. Merge it
          to publish the reference matching the docstrings currently on `main`.
          BODY
          )"
