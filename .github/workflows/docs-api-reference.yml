name: API Reference

# L'artifact Sphinx che alimenta il tab "API Reference" di Mintlify vive nel
# repo: senza questo job resterebbe fermo all'ultima generazione manuale mentre
# le docstring cambiano.

on:
  push:
    branches: ["main"]
    paths:
      - "PyOrchestrate/**/*.py"
      - "sphinx/**"
      - ".github/workflows/docs-api-reference.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-api-reference
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install sphinx==8.1.3
          pip install -e .

      - name: Build API reference artifact
        run: ./scripts/build_api_reference.sh

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain docs/sdk-artifacts)" ]; then
            git add docs/sdk-artifacts
            git commit -m "docs: rigenera l'API reference dalle docstring"
            git push
          else
            echo "Nessuna modifica all'API reference."
          fi
