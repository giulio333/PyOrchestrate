name: PyOrchestrate Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.13 is the development version (.python-version) and the one the
        # API reference is generated with: it must be tested, not just used.
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest black pre-commit
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # `[web]` because fastapi/uvicorn/pydantic are an extra: without it the
      # web interface is not importable and modules touching it are untestable.
      - name: Install repository
        run: |
          pip install -e ".[web]"

      - name: Lint with flake8
        run: |
          # Stop the build on syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats every error as a warning. The GitHub editor is 127 chars wide
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      # --check verifies without rewriting: the job used to run `black .`,
      # which reformatted the sources in the runner and threw the result away
      # at the end of the run, so it always passed and reported nothing.
      - name: Check formatting with black
        run: black --check --diff .

      - name: Test with pytest
        run: pytest --junitxml=junit/test-results-${{ matrix.python-version }}.xml

      - name: Upload pytest test results
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: junit/test-results-${{ matrix.python-version }}.xml
        if: ${{ always() }}
