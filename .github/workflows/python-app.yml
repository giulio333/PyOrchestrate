name: PyOrchestrate Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.13 è la versione di sviluppo (.python-version) e quella con cui
        # viene generata l'API reference: va testata, non solo usata.
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest black pre-commit
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install repository
        run: |
          pip install -e .

      - name: Lint with flake8
        run: |
          # Stoppa la build in caso di errori di sintassi o nomi non definiti
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero tratta tutti gli errori come warning. L'editor GitHub è largo 127 caratteri
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      # --check verifica senza riscrivere: prima il job eseguiva `black .`, che
      # riformattava i sorgenti nel runner e buttava via il risultato a fine run,
      # quindi passava sempre e non segnalava nulla.
      - name: Check formatting with black
        run: black --check --diff .

      - name: Test with pytest
        run: pytest --junitxml=junit/test-results-${{ matrix.python-version }}.xml

      - name: Upload pytest test results
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: junit/test-results-${{ matrix.python-version }}.xml
        if: ${{ always() }}
