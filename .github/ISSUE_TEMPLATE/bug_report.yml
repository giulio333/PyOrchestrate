name: Bug report
description: Report something that does not behave as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please write in English, and do not use this
        form for security problems — see [SECURITY.md](https://github.com/giulio333/PyOrchestrate/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: >
        The smallest script that shows the problem, including the agent and
        orchestrator setup. This is the single most useful thing you can
        provide.
      render: python
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or traceback
      description: Relevant output. Agent logs are per-agent files under `logs/`.
      render: shell

  - type: input
    id: version
    attributes:
      label: PyOrchestrate version
      description: "Output of `pyorchestrate --version`"
      placeholder: "0.2.0"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.13.1"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: dropdown
    id: execution-mode
    attributes:
      label: Execution mode
      description: Process and thread agents fail in different ways; this narrows it down.
      options:
        - Process agents
        - Thread agents
        - Both
        - Not applicable
    validations:
      required: true
