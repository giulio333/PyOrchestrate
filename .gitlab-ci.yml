stages:
  - lint
  - format
  - test
  - review
  - deploy

mypy-check:
  stage: lint
  image: python:3.11
  script:
    - python -m pip install --upgrade pip
    - pip install mypy
    - if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - pip install -e .
    - mypy PyOrchestrate --strict . > mypy-report.txt || true
  artifacts:
    when: always
    paths:
      - mypy-report.txt
  only:
    - main

security-scan:
  stage: lint
  image: python:3.11
  script:
    - python -m pip install --upgrade pip
    - pip install bandit
    - if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - pip install -e .
    - bandit PyOrchestrate -r . -o bandit-report.txt || true
  artifacts:
    when: always
    paths:
      - bandit-report.txt
  only:
    - main

pytest-benchmark:
  stage: test
  image: python:3.11
  script:
    - python -m pip install --upgrade pip
    - pip install pytest pytest-benchmark
    - if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - pip install -e .
    - pytest test/ --benchmark-save=benchmark-results
  artifacts:
    when: always
    paths:
      - .benchmarks
  only:
    - main

flake8-lint:
  stage: lint
  image: python:3.11
  script:
    - python -m pip install --upgrade pip
    - pip install flake8
    - if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - pip install -e .
    - flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics > flake8-report.txt
    - flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics >> flake8-report.txt
  artifacts:
    when: always
    paths:
      - flake8-report.txt
  only:
    - main

flake8-lint-report:
  stage: lint
  image: python:3.11
  script:
    - python -m pip install --upgrade pip
    - pip install flake8 flake8-gl-codeclimate
    - if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - pip install -e .
    - flake8 PyOrchestrate --format gl-codeclimate --output-file gl-code-quality-report.json --exit-zero
  artifacts:
    when: always
    paths:
      - gl-code-quality-report.json
    reports:
      codequality: gl-code-quality-report.json
  only:
    - main

black-format:
  stage: format
  image: python:3.11
  script:
    - python -m pip install --upgrade pip
    - pip install black
    - if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - pip install -e .
    - black . --diff > black-report.txt
    - black .
  artifacts:
    when: always
    paths:
      - black-report.txt
  only:
    - main

pytest-3.11:
  stage: test
  image: python:3.11
  script:
    - python -m pip install --upgrade pip
    - pip install flake8 pytest black pre-commit
    - if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - pip install -e .
    - pytest --junitxml=junit/test-results-3.11.xml
  artifacts:
    when: always
    paths:
      - junit/test-results-3.11.xml
    reports:
      junit: junit/test-results-3.11.xml
  only:
    - main
  environment:
    name: ci

pytest-3.12:
  stage: test
  image: python:3.12
  script:
    - python -m pip install --upgrade pip
    - pip install flake8 pytest black pre-commit
    - if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - pip install -e .
    - pytest --junitxml=junit/test-results-3.12.xml
  artifacts:
    when: always
    paths:
      - junit/test-results-3.12.xml
    reports:
      junit: junit/test-results-3.12.xml
  only:
    - main
  environment:
    name: ci

review-app:
  stage: review
  image: python:3.11
  script:
    - python -m pip install --upgrade pip
    - if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - pip install -e .
    - nohup python examples/communication/example_zmq_pubsub.py &
    - sleep 5
    - echo "Review app started."
  environment:
    name: review/$CI_COMMIT_REF_NAME
    on_stop: stop-review-app
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always
    - if: "$CI_MERGE_REQUEST_ID"
      when: always

stop-review-app:
  stage: review
  image: python:3.11
  script:
    - echo "Stopping review app..."
    - pkill -f "python examples/example_zmq_pubsub.py" || true
  environment:
    name: review/$CI_COMMIT_REF_NAME
    action: stop
  when: manual
  rules:
    - if: "$CI_MERGE_REQUEST_ID"

pages:
  stage: deploy
  image: python:3.11
  script:
    - pip install -r requirements-dev.txt
    - mkdocs build --site-dir public
  artifacts:
    paths:
      - public
  only:
    - main
