[project]
name = "PyOrchestrate"
version = "0.1.0"
description = "PyOrchestrate"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116.1",
    "loguru>=0.7.3",
    "psutil>=7.0.0",
    "pydantic>=2.11.7",
    "pyzmq>=26.4.0",
    "requests>=2.32.3",
    "uvicorn>=0.35.0",
]

[project.scripts]
pyorchestrate = "PyOrchestrate.cli:main"
